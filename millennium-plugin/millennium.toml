[plugin]
id = "com.saber.steamhappy"
name = "SteamHappy Spammer"
version = "0.1.0"
author = "Saber"
description = "在 Steam 聊天界面里一键连发 steamhappy 表情；次数与间隔可调。"

[frontend]
entry = "frontend/index.tsx"

[compiler]
# auto = 检测到 Millennium 安装后自动把插件装进去；也可改成固定路径
output_path = "auto"

[dev]
auto_restart = true
reload_steamui_when = "both"
